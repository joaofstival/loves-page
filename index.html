<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf8" />
  <meta name="description" content="Uma pequena página feita com amor — a nossa história, os nossos momentos e o nosso tempo juntos." />
  <title>Kat &amp; João · Nosso pra sempre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <!-- Pré-carrega a imagem de capa do hero (aparece enquanto o vídeo carrega) -->
  <link rel="preload" as="image" href="assets/img/momento1.jpg" />

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" />

  <!-- Estilos (a ordem importa: tokens → base → seções → micro-interações) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/story.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <link rel="stylesheet" href="css/counter.css" />
  <link rel="stylesheet" href="css/messages.css" />
  <link rel="stylesheet" href="css/micro.css" />

  <!-- Import map: Three.js via CDN, sem etapa de build -->
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
  </script>
</head>
<body>
  <!-- Corações 3D ao fundo (js/hearts3d.js) -->
  <canvas id="hearts-canvas" aria-hidden="true"></canvas>

  <main>
    <!-- Cada seção é renderizada pelo seu módulo a partir de js/config.js -->
    <section id="hero" class="section hero">
      <noscript>
        <div class="container">
          <h1 class="section-title">Kat &amp; João</h1>
          <p class="section-lead">Esta página foi feita com carinho e precisa de JavaScript ativado para mostrar a nossa história. 💌</p>
        </div>
      </noscript>
    </section>
    <section id="story" class="section story"></section>
    <section id="gallery" class="section gallery"></section>
    <section id="counter" class="section counter"></section>
    <section id="messages" class="section messages"></section>
  </main>

  <footer class="site-footer">
    <p><span class="site-footer__text">Feito com amor, para o nosso pra sempre.</span> <span class="heart" aria-hidden="true">♥</span></p>
  </footer>

  <!-- Frases flutuantes (js/floating.js) -->
  <div id="floating-layer" aria-hidden="true"></div>
  <!-- Confete de corações (js/confetti.js) -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
